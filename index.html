<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTS DPW</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>
      <ul class="topnav">
        <li><a href="#">Home</a></li>
        <li><a href="#">Isekai</a></li>
        <li><a href="#">Contact</a></li>
        <li><a href="#">About</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <img src="/asset/images.jpeg" alt="Foto" width="100" style="display: block; margin: 0 auto; border-radius: 100%;">
    <h1>Deskripsi Diri</h1>
    <p>Perkenalkan nama Saya Romeo, saya adalah seorang mahasiswa yang nyantuy.</p>
    <p>Saya tertarik pada ... dan tidak terdorong</p>

    <section>
      <h2>Kemampuan</h2>
      <ul id="skillList" style="display: none;">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>tidur</li>
      </ul>
      <button id="toggleSkill" type="button">Tampilkan Kemampuan</button>
    </section>
  </main>

  <footer>
    <label for="fname">Ulasan:</label><br>
    <input type="text" id="fname" name="fname"><br>
    <label for="lname">Saran:</label><br>
    <input type="text" id="lname" name="lname">
    <p>Copyright &copy; 2024 Romeo</p>
  </footer>

  <script>
    const toggleButton = document.getElementById('toggleSkill');
    const skillList = document.getElementById('skillList');

    toggleButton.addEventListener('click', function () {
      const isHidden = skillList.style.display === 'none';
      skillList.style.display = isHidden ? 'block' : 'none';
      toggleButton.textContent = isHidden ? 'Sembunyikan Kemampuan' : 'Tampilkan Kemampuan';
    });
  </script>
</body>

</html>
